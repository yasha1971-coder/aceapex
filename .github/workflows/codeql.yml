# CodeQL code scanning, GitHub's standard workflow (advanced setup).
name: "CodeQL"

on:
  push:
    branches: [ "dev", "release", "main" ]
  pull_request:
    # main: its protection requires the three Analyze checks, and a release PR into main has a head that is not on dev
    # (2.6.6: PR #56, head release-2.6.x 7556cf3 - no CodeQL had run on it, the PR stayed blocked)
    branches: [ "dev", "release", "main" ]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
