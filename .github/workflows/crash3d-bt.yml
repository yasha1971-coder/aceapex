# CRASH-3d C-bt (research branch crash-3 only): row C of CRASH-3d hung instead of crashing; 4 short runs with a backtrace
# of the hung process. Same SHA as CRASH-3d.
# TurboBench tag v2026.11.06.165 (2cc8b4f; aceapex b67c858, zstd 49bf1d1), ubuntu:26.10 (pinned digest).
#   A gcc 16.2, their make (dynamic), no patch       B gcc 16.2, their make, research/crash1/crash3/tb-fix.patch
#   C clang 22.1.8, their make, no patch             D clang 22.1.8, their make, tb-fix.patch
#   E gcc 16.2, their make, no patch, aceapex compiled with -DACEAPEX_ENV_TUNING and run with AX_HUGE=0
#     (a library build reads no environment without ACEAPEX_ENV_TUNING: ax_env.h)
#   F gcc 16.2, `make STATIC=1 PHAZ=0` (the release command), no patch
name: CRASH-3d C-bt
on:
  push:
    branches: [crash-3]
    paths: ['.github/workflows/crash3d-bt.yml']
permissions:
  contents: read
jobs:
  d:
    name: ${{ matrix.v }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    container: ubuntu:26.10@sha256:262df65c0ec6bf8d9dcc87454f4330a05fae4b97825f45854af3b136666584c2
    strategy:
      fail-fast: false
      matrix:
        include:   # C-bt: clang 22.1.8, their make, no patch; 4 runs t1, 300 s cap, backtrace on timeout
        - {v: C, cc: clang-22, cxx: clang++-22, patch: no,  static: no,  huge0: no}
    env:
      TB_TAG: v2026.11.06.165
      TB_SHA: 2cc8b4f44d12147bb695784f9fdb99955c5de50d
      ACEAPEX_PIN: b67c858b3b18d4d57aee1aa7bcaf0cf2c773d050
      OUT: /__w/out
    steps:
    - name: tools
      run: |
        apt-get update -q
        DEBIAN_FRONTEND=noninteractive apt-get install -y -q git ca-certificates curl unzip file gdb build-essential nasm make cmake libomp-dev python3 patch gcc-16 g++-16 clang-22
        mkdir -p $OUT
        { grep -m1 "model name" /proc/cpuinfo; g++-16 --version | head -1; clang++-22 --version | head -1; } | tee $OUT/env.txt
    - uses: actions/checkout@v5
    - name: inputs
      run: |
        mkdir -p $GITHUB_WORKSPACE/in; cd $GITHUB_WORKSPACE/in
        curl -fsSL -o silesia.tar.gz https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz && gzip -dc silesia.tar.gz > silesia.tar && rm silesia.tar.gz
        for i in 1 2 3 4 5; do curl -fsSL --retry 3 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip && unzip -tq enwik9.zip && break; sleep 20; done
        unzip -q enwik9.zip && rm enwik9.zip
        echo "a667bac80089b3d04d5496772149e632f0758974b0579d743cd8d6e5e0d63eb2  silesia.tar" | sha256sum -c
        echo "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc  enwik9" | sha256sum -c
    - name: source, patch
      run: |
        cd /tmp && git clone -q --branch $TB_TAG --recursive https://github.com/powturbo/TurboBench.git tb && cd tb
        test "$(git rev-parse HEAD)" = "$TB_SHA" || { echo "FAIL: TurboBench HEAD $(git rev-parse HEAD)"; exit 1; }
        test "$(git -C aceapex rev-parse HEAD)" = "$ACEAPEX_PIN" || { echo "FAIL: aceapex $(git -C aceapex rev-parse HEAD)"; exit 1; }
        { echo "TurboBench $(git rev-parse HEAD) ($TB_TAG)"; echo "aceapex $(git -C aceapex rev-parse HEAD)"; } | tee $OUT/source.txt
        if [ ${{ matrix.patch }} = yes ]; then patch -p1 < $GITHUB_WORKSPACE/research/crash1/crash3/tb-fix.patch | tee $OUT/patch.txt; git diff turbobench.c | tee $OUT/applied.diff; fi
        if [ ${{ matrix.huge0 }} = yes ]; then sed -i 's|-DXXH_INLINE_ALL -Izstd/lib -I$(ACEAPEX_DIR) -c $< -o $@|-DXXH_INLINE_ALL -DACEAPEX_ENV_TUNING -Izstd/lib -I$(ACEAPEX_DIR) -c $< -o $@|' makefile; git diff makefile | tee $OUT/applied.diff; grep -q ACEAPEX_ENV_TUNING makefile || { echo "FAIL: sed"; exit 1; }; fi
    - name: build
      run: |
        cd /tmp/tb; C=${{ matrix.cc }}; X=${{ matrix.cxx }}; BD=build-${{ matrix.v }}
        # STATIC=1 makes the makefile link with plain `g++`/`gcc` (CXL:=g++, CCO:=gcc); the system g++ differs from g++-16 and the
        # static libstdc++ link fails (run 1 of CRASH-3d, std::vformat): link with the same compiler
        S=""; [ ${{ matrix.static }} = yes ] && S="STATIC=1 PHAZ=0 CXL=${{ matrix.cxx }} CCO=${{ matrix.cc }}"
        echo "make CC=$C CXX=$X CG=clang-22 BUILD=$BD BLOSC=0 OPENZL=0 PIVCO=0 RUST=0 $S" | tee $OUT/make-cmd.txt
        : > $OUT/removed-codecs.txt; ok=0
        for try in 1 2 3 4 5 6 7 8; do
          if make CC=$C CXX=$X CG=clang-22 BUILD=$BD BLOSC=0 OPENZL=0 PIVCO=0 RUST=0 $S > $OUT/make-$try.log 2>&1; then ok=1; cp $OUT/make-$try.log $OUT/make.log; break; fi
          t=$(grep -E "^make: \*\*\* \[makefile:[0-9]+: $BD/" $OUT/make-$try.log | tail -1 | sed -E "s#.*: $BD/([^/]+)/.*#\1#")
          echo "try $try failed at: $t"; tail -12 $OUT/make-$try.log
          if [ -z "$t" ] || [ "$t" = aceapex ] || [ "$t" = zstd ] || [ ! -d "$t" ]; then echo "FAIL: cannot continue ($t)"; exit 1; fi
          echo "$t (try $try): $(grep -m1 -E 'error' $OUT/make-$try.log | cut -c1-200)" >> $OUT/removed-codecs.txt; rm -rf "$t"
        done
        [ $ok = 1 ] || exit 1
        grep -E "aceapex_api\.cpp" $OUT/make.log | tee $OUT/aceapex-compile-line.txt
        grep -E "turbobench\.c " $OUT/make.log | head -1 | tee $OUT/turbobench-compile-line.txt
        { sha256sum turbobench; file turbobench; ./turbobench -l2 2>&1 | grep -i aceapex; nm turbobench | grep -E " T (aligned_alloc|malloc)$" || echo "no interposers in the binary"; } | tee $OUT/binary.txt
    - name: runs under gdb, 300 s cap, backtrace on timeout
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/in; mkdir -p $OUT/bt
        for spec in "silesia.tar aceapex,1" "enwik9 aceapex,1" "silesia.tar aceapex,4" "silesia.tar aceapex-fast,1"; do
          set -- $spec; f=$1; e=$2; n=$OUT/bt/$f-${e/,/-}
          echo "timeout -s INT 300 gdb -batch -ex run -ex 'info threads' -ex 'thread apply all bt 8' -ex kill --args /tmp/tb/turbobench $f -C4 -v2 -U -e$e" > $n.cmd.txt
          start=$(date +%s)
          timeout -s INT 300 gdb -q -batch -ex run -ex "info threads" -ex "thread apply all bt 8" -ex kill --args /tmp/tb/turbobench $f -C4 -v2 -U -e$e > $n.gdb.txt 2>&1; rc=$?
          el=$(( $(date +%s) - start ))
          if grep -q "received signal SIGINT" $n.gdb.txt; then res="HANG: stopped by SIGINT at 300 s"
          elif grep -q "received signal SIGSEGV" $n.gdb.txt; then res="SIGSEGV"
          elif grep -q "exited normally" $n.gdb.txt; then res="exited normally (rc 0)"
          else res="other (gdb rc $rc): $(grep -m1 -E 'exited with code|received signal' $n.gdb.txt)"; fi
          echo "$f $e: $res after ${el}s | $(sed 's/\x1b\[[0-9;]*m//g' $n.gdb.txt | grep -E " ${e/,/ } +$f\$" | tail -1 | tr -s ' ')" | tee -a $OUT/bt/summary.txt
          grep -E "received signal|^#[0-9]|^Thread|^\* " $n.gdb.txt | head -14
        done
        cat $OUT/bt/summary.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: crash3d-bt-C
        path: /__w/out
        retention-days: 30
