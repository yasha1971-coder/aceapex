name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # weekly: judge every paper tag from its own sources
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
    # Release gate "CPU without AVX-512" (2.6.2): on a runner without avx512f (e.g. EPYC 7763) this job's round trips
    # (make test) are the AVX2 path on real hardware; the line below says which case this run is.
    - name: CPU of the runner
      run: |
        lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | sed 's/Flags:.*/&/' | cut -c1-200
        if grep -qw avx512f /proc/cpuinfo; then echo "AVX512: present (this run does not count as the no-AVX-512 check)"
        else echo "AVX512: absent; avx2: $(grep -qw avx2 /proc/cpuinfo && echo yes || echo no) -> make test below runs the AVX2 path without AVX-512"; fi
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libzstd-dev pkg-config python3-numpy samtools tabix

    - name: Build
      run: make

    - name: Test BIT-PERFECT on random data
      run: |
        dd if=/dev/urandom of=/tmp/test.bin bs=1M count=10 2>/dev/null
        ./aceapex c --in /tmp/test.bin --out /tmp/test.acpx --threads 2
        ./aceapex d --in /tmp/test.acpx --out /tmp/test_out
        diff /tmp/test.bin /tmp/test_out && echo "BIT-PERFECT OK"

    # chr1 весит 254 MB; кэш держит его между прогонами, качается только при промахе
    - name: Cache chr1
      id: cache-chr1
      uses: actions/cache@v5
      with:
        path: ~/golden/genome/chr1.fa
        key: chr1-hg38-9465e0f0df6e2c6eb39729c39cee5465

    # Условие по факту наличия файла, а не по флагу кэша: первый прогон получил
    # cache-hit при пустом кэше, скачивание пропустилось и контракт упал на пустом месте.
    - name: Fetch chr1
      run: |
        mkdir -p ~/golden/genome
        if [ ! -s ~/golden/genome/chr1.fa ]; then
          curl -sL -o /tmp/chr1.fa.gz https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr1.fa.gz
          gunzip -c /tmp/chr1.fa.gz > ~/golden/genome/chr1.fa
        fi
        ls -la ~/golden/genome/chr1.fa
        echo "9465e0f0df6e2c6eb39729c39cee5465  $HOME/golden/genome/chr1.fa" | md5sum -c -

    # Контракт в пустом окружении — так его запускает посторонний.
    # Наша сессия дважды показывала неверный результат из-за оставленных переменных.
    - name: Contract
      run: |
        ls -la ~/golden/genome/chr1.fa || { echo "корпус не на месте"; exit 1; }
        env -i PATH="$PATH" HOME="$HOME" CHR1="$HOME/golden/genome/chr1.fa" ./reproduce_paper5.sh 2>&1 | tee /tmp/contract.log
        # chr1 обязателен; enwik/silesia/fastq на раннере нет и это нормально
        grep -q "PASS chr1_md5" /tmp/contract.log || { echo "chr1 не проверен"; exit 1; }
        grep -q "PASS lowlat_chr1_ratio" /tmp/contract.log || { echo "корпусные проверки не отработали"; exit 1; }
        grep -c "skipped-no-tool" /tmp/contract.log | xargs echo "  пропущено из-за отсутствующих инструментов:"
        grep -qE "summary: [0-9]+ pass, 0 fail" /tmp/contract.log || { echo "контракт упал"; grep FAIL /tmp/contract.log; exit 1; }
        grep -oE "summary: [0-9]+ pass, [0-9]+ fail, [0-9]+ skipped" /tmp/contract.log | head -1

    # One entry point, same as a stranger runs locally: contract + 200 regions, empty env.
    - name: make test (verify.sh HEAD)
      run: |
        make test
        python3 -c "import json;p=json.load(open('results/HEAD.json'))['provenance'];print(p);raise SystemExit(p['fail']+p['build_failed'])"
    # A red judge names its claims here and keeps HEAD.json as an artifact.
    - name: Failed claims
      if: failure()
      run: python3 -c "import json;d=json.load(open('results/HEAD.failed.json'));print('missing:',d['provenance'].get('missing'));[print(c['claim_id'],c['verdict'],'measured:',str(c.get('measured'))[:300]) for c in d['result']['claims'] if c['verdict'] not in ('pass','skipped','declared')]" || true
    - name: verify.sh self-test (stale records, early exit, missing claim -> FAIL)
      run: bash scripts/verify_selftest.sh
    - uses: actions/upload-artifact@v5
      if: always()
      with: {name: results-HEAD, path: "results/HEAD*.json", if-no-files-found: ignore}

  # A4: the C decoder and the CLI on aarch64 and armv7 under qemu-user, all fixtures bit-perfect,
  # and the ARM encoders must produce the same bytes as the x86 fixture of the same libzstd line.
  fuzz:
    name: corrupted archives through the C API (all profiles, ASan+UBSan, 60 s) + negative control
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: deps
      run: sudo apt-get update && sudo apt-get install -y build-essential libzstd-dev
    - name: api_fuzz 60 s (gate - verified-silent 0, bad rc 0, no sanitizer report)
      run: |
        SAN="-O1 -g -std=c++17 -fsanitize=address,undefined -fno-sanitize-recover=all"
        g++ $SAN -Isrc scripts/api_fuzz.cpp src/aceapex_api.cpp -o api_fuzz -lzstd -lpthread
        ./api_fuzz 60 "$GITHUB_RUN_ID"
    - name: negative control (a buffer one byte short must be reported)
      run: |
        if ./api_fuzz control > control.txt 2>&1; then cat control.txt; echo "negative control NOT caught"; exit 1; fi
        grep -q 'ERROR: AddressSanitizer' control.txt && echo "negative control caught"
    - name: ClusterFuzzLite harness fuzz/fuzz_api.cpp with gcc (seeds + 60 s mutations) + VERIFY-assert negative control
      run: |
        SAN="-O1 -g -std=c++17 -fsanitize=address,undefined -fno-sanitize-recover=all"
        g++ $SAN -Isrc -c src/aceapex_api.cpp -o api.o && mkdir seeds
        g++ $SAN -Isrc fuzz/make_seeds.cpp api.o -o make_seeds -lzstd -lpthread && ./make_seeds seeds
        g++ $SAN -Isrc fuzz/fuzz_api.cpp fuzz/standalone.cpp api.o -o fz -lzstd -lpthread && ./fz 60 seeds/*
        g++ $SAN -DFUZZ_API_CONTROL -Isrc fuzz/fuzz_api.cpp fuzz/standalone.cpp api.o -o fzc -lzstd -lpthread
        if ./fzc 60 seeds/verify*; then echo "VERIFY-assert negative control NOT caught"; exit 1; fi; echo "VERIFY-assert negative control caught"
  decoder-source:
    name: ax_fast.h == the decoder of aceapex-fast (pinned commit, scripts/axfast.lock)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: fetch the pinned aceapex-fast commit and compare
      run: |
        C=$(sed -n 's/^commit=//p' scripts/axfast.lock)
        git clone -q https://github.com/yasha1971-coder/aceapex-fast.git /tmp/aceapex-fast
        git -C /tmp/aceapex-fast checkout -q "$C"
        python3 scripts/sync_axfast.py --check /tmp/aceapex-fast/axfast.c
  arm:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Cross toolchains and qemu
      run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static
    - name: Static libzstd for both targets
      run: git clone -q --depth 1 --branch v1.5.6 https://github.com/facebook/zstd.git /tmp/zstd && sudo bash scripts/arm_zstd.sh /tmp/zstd /opt/zstd-arm
    - name: Judge
      run: |
        bash scripts/arm_test.sh | tee /tmp/arm.tsv
        grep -q fail /tmp/arm.tsv && exit 1
        [ "$(grep -c pass /tmp/arm.tsv)" = 4 ] || { echo "expected 4 pass"; exit 1; }

  # The library TU as lzbench and TurboBench compile it, with the compilers that broke inside lzbench's CI (#355):
  # MinGW-w64 x86_64/i686, gcc 10, 32-bit ARMv5 (no __atomic_*_8 in the object). Must pass before any release.
  portability:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Cross compilers
      run: sudo apt-get update && sudo apt-get install -y libzstd-dev g++-mingw-w64-x86-64-posix g++-mingw-w64-i686-posix g++-10 g++-arm-linux-gnueabi
    - name: zstd headers for the cross builds
      run: git clone -q --depth 1 --branch v1.5.6 https://github.com/facebook/zstd.git /tmp/zstd
    - name: Judge
      run: |
        ZSTD_INC=/tmp/zstd/lib bash scripts/portability_test.sh | tee /tmp/port.tsv
        grep -q $'\tpass\t' /tmp/port.tsv

  # The library on Windows itself (not a cross build): MSYS2 UCRT64 gcc + zstd; conformance fixtures through the library,
  # round trips through the API at levels 1-4, 11, 14 and t1 / t4 (scripts/windows_test.sh). The CLI is Linux / macOS only.
  # A release gate: 0 failures.
  windows-msys2:
    runs-on: windows-2022
    defaults:
      run: {shell: 'msys2 {0}'}
    steps:
    - run: git config --global core.autocrlf false
      shell: pwsh
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-zstd
    - name: Judge
      run: bash scripts/windows_test.sh

  # TurboBench gate (2.6.2, decision of Yakiv 13.11): clean upstream powturbo/TurboBench 8a0ec42, its aceapex submodule
  # switched to the commit under test, codecs off only by the upstream make flags RUST=0 BLOSC=0 OPENZL=0; make and
  # make STATIC=1 with the runner's gcc; silesia.tar (211 947 520 B, sha256 a667bac8..., the source upstream's CI uses)
  # through aceapex 1-4 and aceapex_fast 1, 3 in both builds: no error, the same sizes.
  turbobench:
    runs-on: ubuntu-24.04
    env:
      TB_SHA: 8a0ec42f1e0cec9965407655d4ce2eb367948f7c
      ACE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SIL_SHA: a667bac80089b3d04d5496772149e632f0758974b0579d743cd8d6e5e0d63eb2
    steps:
    - name: Dependencies (as upstream's CI)
      run: sudo apt-get update && sudo apt-get install -y nasm libomp-dev
    - uses: actions/cache@v5
      with: {path: ~/corpus/silesia.tar, key: silesia-a667bac80089b3d0}
    - name: silesia.tar
      run: |
        mkdir -p ~/corpus
        [ -s ~/corpus/silesia.tar ] || curl -sL https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz | gunzip -c > ~/corpus/silesia.tar
        echo "$SIL_SHA  $HOME/corpus/silesia.tar" | sha256sum -c -
    - name: Upstream TurboBench, aceapex submodule on the commit under test
      run: |
        git clone -q https://github.com/powturbo/TurboBench.git tb && cd tb && git checkout -q $TB_SHA
        git submodule update --init --recursive -q
        git -C aceapex fetch -q origin $ACE_SHA && git -C aceapex checkout -q $ACE_SHA
        echo "TurboBench $(git rev-parse HEAD); aceapex $(git -C aceapex rev-parse HEAD); $(gcc --version | head -1)"
        echo "aceapex block of the makefile: $(sed -n '/^# aceapex/,/^endif/p' makefile | md5sum | cut -c1-32)"
        git status --short | grep -v '^ M aceapex$' || true
    - name: make (dynamic)
      run: cd tb && { make -j4 RUST=0 BLOSC=0 OPENZL=0 || { rm -rf build && make -j1 RUST=0 BLOSC=0 OPENZL=0; }; } && mv turbobench ../tb_dyn
    - name: make STATIC=1
      run: |
        cd tb && { make -j4 STATIC=1 RUST=0 BLOSC=0 OPENZL=0 BUILD=build-static || { rm -rf build-static && make -j1 STATIC=1 RUST=0 BLOSC=0 OPENZL=0 BUILD=build-static; }; } && mv turbobench ../tb_static
        file ../tb_static
    - name: Run both builds on silesia.tar
      run: |
        mkdir run && cp ~/corpus/silesia.tar run/
        for b in dyn static; do ( cd run && ../tb_$b -eaceapex,1,2,3,4/aceapex_fast,1,3 -i1,1 silesia.tar ) > tb_$b.log 2>&1; echo "$b rc $?"; done
        for b in dyn static; do grep -E '^ +[0-9]+ .*aceapex' tb_$b.log | head -6 | awk '{print $1, $4, $5}' > sizes_$b.txt; echo "== $b"; cat sizes_$b.txt; done
        ! grep -qiE 'error|mismatch' tb_dyn.log tb_static.log
        [ "$(wc -l < sizes_dyn.txt)" = 6 ] && cmp sizes_dyn.txt sizes_static.txt

  verify-tags:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with: {fetch-depth: 0}
    - run: sudo apt-get update && sudo apt-get install -y build-essential libzstd-dev python3-numpy
    - uses: actions/cache@v5
      with: {path: ~/golden/genome/chr1.fa, key: chr1-hg38-9465e0f0df6e2c6eb39729c39cee5465}
    - run: |
        mkdir -p ~/golden/genome
        [ -s ~/golden/genome/chr1.fa ] || curl -sL https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr1.fa.gz | gunzip -c > ~/golden/genome/chr1.fa
        echo "9465e0f0df6e2c6eb39729c39cee5465  $HOME/golden/genome/chr1.fa" | md5sum -c -
    - name: verify.sh over every paper tag
      run: ./verify.sh paper6-v1 paper5-v1 v4.0 v3.0 v2.0 v1.0.0
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: results-tags
        path: |
          results/*.json
          !results/HEAD.json
